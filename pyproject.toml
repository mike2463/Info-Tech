[project]
name = "invoice-intake-agent"
version = "0.1.0"
description = "An OpenAI Agents SDK agent that ingests an inbound email + PDF invoice and notifies Customer Service."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai-agents>=0.0.19",
    "openai>=1.60.0",
    "pymupdf>=1.24.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
invoice-agent = "invoice_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_agent"]

[tool.uv]
package = true
